<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Login | Google OAuth</title>

  <!-- Google Identity Services -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: rgb(0,255,255);
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .login-container {
      background-color: rgb(0,150,255);
      padding: 36px;
      border-radius: 12px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.15);
      width: 92%;
      max-width: 420px;
      text-align: center;
    }
    h2 { color: #fff; margin-bottom: 20px; }
    .input-box { width:100%; padding:10px; margin:8px 0; border-radius:6px; border:none; }
    .login-btn { width:100%; background:#fff; color:rgb(0,150,255); padding:12px; border-radius:6px; border:none; cursor:pointer; }
    .or-text { color:#fff; margin:18px 0; }
    #google-btn { display:flex; justify-content:center; margin-bottom:12px; }
    .small { font-size:0.9rem; color:#fff; margin-top:12px; }
    .small a { color:#000; font-weight:700; text-decoration:none; }
    .small a:hover { text-decoration:underline; }
  </style>
</head>
<body>
  <div class="login-container">
    <h2>Login to Your Account</h2>

    <!-- Google button target -->
    <div id="google-btn"></div>

    <div class="or-text">OR</div>

    <!-- Email login -->
    <input id="email" class="input-box" type="email" placeholder="Email" autocomplete="username" />
    <input id="password" class="input-box" type="password" placeholder="Password" autocomplete="current-password" />
    <button id="emailLoginBtn" class="login-btn">Login</button>

    <div class="small">New user? <a href="signup.html">Sign up here</a></div>
  </div>

  <script>
  // ---- config ----
  const BACKEND = "https://my-backanduffufr7t.onrender.com";
  
  // ⚠️ Use your correct client ID here:
  const GOOGLE_CLIENT_ID = "743101457462-pv42b9mqemsj52eg7vulkldceqt2i9d3.apps.googleusercontent.com";

  // ---- helper: wait until google.accounts.id available ----
  function waitForGoogle(timeoutMs = 10000) {
    return new Promise((resolve, reject) => {
      const start = Date.now();
      (function poll() {
        if (window.google && google.accounts && google.accounts.id) {
          return resolve(true);
        }
        if (Date.now() - start > timeoutMs) {
          return reject(new Error("Google Identity script not available (timeout)"));
        }
        setTimeout(poll, 150);
      })();
    });
  }

  // ---- handle Google token (send to backend) ----
  async function handleCredentialResponse(response) {
    if (!response || !response.credential) {
      alert("Google response missing credential.");
      return;
    }
    try {
      const r = await fetch(`${BACKEND}/api/google-login`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ token: response.credential }),
      });
      const data = await r.json();

      if (r.ok && data.status === "success") {
        alert(`Welcome, ${data.name}`);
        window.location.href = "index.html";
      } else {
        alert(data.message || "Google login failed.");
      }
    } catch (err) {
      console.error("Network error during Google login:", err);
      alert("Network error. Try again later.");
    }
  }

  // ---- initialize GSI button safely ----
  (async function initGoogleButton() {
    try {
      await waitForGoogle();
      google.accounts.id.initialize({
        client_id: GOOGLE_CLIENT_ID,
        callback: handleCredentialResponse,
      });
      google.accounts.id.renderButton(
        document.getElementById("google-btn"),
        { theme: "outline", size: "large", width: 280 }
      );
    } catch (err) {
      console.error("Error initializing Google button:", err);
    }
  })();

  // ---- EMAIL LOGIN ----
  const emailBtn = document.getElementById("emailLoginBtn");
  emailBtn.addEventListener("click", async () => {
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    if (!email || !password) {
      alert("Please enter both email and password.");
      return;
    }

    emailBtn.disabled = true;
    emailBtn.textContent = "Logging in...";

    try {
      const res = await fetch(`${BACKEND}/api/email-login`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, password }),
      });
      const data = await res.json();

      if (res.ok && data.status === "success") {
        alert(`Welcome, ${data.name}`);
        window.location.href = "index.html";
      } else {
        alert(data.message || "Login failed. Check credentials.");
      }
    } catch (err) {
      console.error("Network error during email login:", err);
      alert("Unable to reach server. Try again later.");
    } finally {
      emailBtn.disabled = false;
      emailBtn.textContent = "Login";
    }
  });
  </script>
</body>
</html>

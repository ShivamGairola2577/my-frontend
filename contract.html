<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contact Us | RenderApp</title>

  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #e0f7ff;
      margin: 0;
      padding: 5vh 5vw;
    }

    .contact-container {
      max-width: 650px;
      margin: 0 auto;
      background: #ffffff;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
    }

    h1 {
      text-align: center;
      color: #0077b6;
      margin-bottom: 1rem;
    }

    p {
      text-align: center;
      color: #333;
      margin-bottom: 1.5rem;
    }

    .contact-options {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .contact-option {
      display: flex;
      align-items: center;
      gap: 1rem;
      background-color: #f9f9f9;
      padding: 1rem;
      border-radius: 8px;
      text-decoration: none;
      color: #333;
      border: 1px solid #ddd;
      transition: background-color 0.3s;
      word-break: break-all;
    }

    .contact-option:hover {
      background-color: #dff6ff;
    }

    .contact-option span {
      font-weight: bold;
    }

    /* Contact Form */
    form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    input, textarea, button {
      width: 100%;
      padding: 0.8rem;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 1rem;
    }

    button {
      background-color: #0077b6;
      color: white;
      font-weight: bold;
      cursor: pointer;
      border: none;
      transition: background-color 0.3s;
    }

    button:hover {
      background-color: #005f87;
    }

    .message {
      text-align: center;
      font-weight: bold;
      margin-top: 10px;
    }

    @media (max-width: 600px) {
      .contact-option {
        gap: 0.5rem;
      }
    }
  </style>
</head>
<body>

  <div class="contact-container">
    <h1>Contact Us</h1>
    <p>We’d love to hear from you! Choose one of the options below or send us a message.</p>

    <div class="contact-options">
      <a class="contact-option" target="_blank" 
         href="https://mail.google.com/mail/?view=cm&to=shivamgairola30@gmail.com&su=Hello&body=I%20wanted%20to%20get%20in%20touch.">
        📧 <span>Email Us</span> — shivamgairola30@gmail.com
      </a>

      <a class="contact-option" href="tel:+918954159979">
        📞 <span>Call Us</span> — +91 8954159979
      </a>

      <a class="contact-option" href="https://wa.me/918954159979?text=Hi%20there!" target="_blank">
        💬 <span>Chat on WhatsApp</span> — +91 8954159979
      </a>
    </div>

    <!-- Contact form that connects to your Render backend -->
    <form id="contactForm">
      <input type="text" id="name" placeholder="Your Name" required />
      <input type="email" id="email" placeholder="Your Email" required />
      <textarea id="message" rows="4" placeholder="Your Message" required></textarea>
      <button type="submit">Send Message</button>
      <div id="msg" class="message"></div>
    </form>
  </div>

  <script>
    // ✅ Your backend Render URL
    const BACKEND_URL = "https://my-backanduffufr7t.onrender.com";

    document.getElementById("contactForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const name = document.getElementById("name").value.trim();
      const email = document.getElementById("email").value.trim();
      const message = document.getElementById("message").value.trim();
      const msgEl = document.getElementById("msg");
      msgEl.textContent = "Sending...";

      try {
        const res = await fetch(`${BACKEND_URL}/api/contact`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name, email, message }),
        });

        const data = await res.json();
        if (res.ok) {
          msgEl.textContent = "✅ Message sent successfully!";
          e.target.reset();
        } else {
          msgEl.textContent = "❌ Failed to send. " + (data.message || "");
        }
      } catch (err) {
        msgEl.textContent = "⚠️ Server not reachable.";
        console.error(err);
      }
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Booking History | RenderApp</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f8fc;
      margin: 0;
      padding: 20px;
      text-align: center;
      color: #333;
    }

    h1 {
      color: #007bff;
      margin-bottom: 10px;
    }

    .balance {
      font-size: 18px;
      margin-bottom: 20px;
      background: #e3f2fd;
      padding: 10px 20px;
      border-radius: 10px;
      display: inline-block;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
    }

    .history-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      margin-bottom: 20px;
    }

    .history-card {
      background: white;
      width: 90%;
      max-width: 500px;
      border-radius: 12px;
      box-shadow: 0 3px 6px rgba(0, 0, 0, 0.1);
      padding: 15px;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 15px;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .history-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 10px rgba(0, 0, 0, 0.15);
    }

    .history-card img {
      width: 80px;
      height: 80px;
      object-fit: cover;
      border-radius: 8px;
    }

    .details {
      flex: 1;
    }

    .details strong {
      font-size: 16px;
      color: #0096ff;
    }

    .details p {
      margin: 5px 0;
      font-size: 15px;
    }

    .details small {
      color: gray;
    }

    button {
      padding: 10px 18px;
      background: #0096ff;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
      transition: background 0.3s;
    }

    button:hover {
      background: #0078cc;
    }

    @media (max-width: 600px) {
      .history-card {
        flex-direction: column;
        text-align: center;
      }

      .history-card img {
        width: 100%;
        height: auto;
      }
    }
  </style>
</head>
<body>
  <h1>📜 Booking History</h1>

  <div class="balance">
    💰 Remaining Balance: $<span id="remainingBalance">0</span>
  </div>

  <div class="history-container" id="historyContainer">
    <p>Loading your history...</p>
  </div>

  <button id="homeBtn">⬅️ Back to Home</button>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const balanceElement = document.getElementById("remainingBalance");
      const historyContainer = document.getElementById("historyContainer");
      const homeBtn = document.getElementById("homeBtn");

      // ✅ Load wallet balance
      const wallet = parseFloat(localStorage.getItem("wallet") || "2000");
      balanceElement.textContent = wallet.toFixed(2);

      // ✅ Load booking history
      const history = JSON.parse(localStorage.getItem("bookingHistory") || "[]");
      historyContainer.innerHTML = "";

      if (history.length === 0) {
        historyContainer.innerHTML = "<p>No booking history yet.</p>";
      } else {
        history.slice().reverse().forEach(item => {
          const card = document.createElement("div");
          card.className = "history-card";
          card.innerHTML = `
            <img src="${item.image || 'https://via.placeholder.com/80'}" alt="Booking Image" />
            <div class="details">
              <strong>${item.desc || 'Booking'}</strong>
              <p>💵 $${item.amount?.toFixed ? item.amount.toFixed(2) : item.amount}</p>
              <small>📅 ${item.date || 'Unknown Date'}</small>
            </div>
          `;
          historyContainer.appendChild(card);
        });
      }

      // ✅ Back button
      homeBtn.addEventListener("click", () => {
        window.location.href = "main.html";
      });
    });
  </script>
</body>
</html>

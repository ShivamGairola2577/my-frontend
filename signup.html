<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Signup</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, rgb(0, 255, 255), rgb(0, 150, 255));
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Navbar */
    .main-nav {
      display: flex;
      justify-content: center;
      align-items: center;
      background: rgb(0, 120, 220);
      padding: 15px 0;
    }

    .nav-left {
      list-style: none;
      display: flex;
      gap: 25px;
      margin: 0;
      padding: 0;
    }

    .nav-left a {
      text-decoration: none;
      color: white;
      font-weight: bold;
      font-size: 18px;
      transition: color 0.3s ease;
    }

    .nav-left a:hover {
      color: #e0e0e0;
    }

    /* Form container */
    .form-container {
      background: white;
      max-width: 450px;
      margin: 60px auto;
      padding: 35px 25px;
      border-radius: 12px;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
      animation: fadeIn 0.5s ease-in-out;
    }

    .form-container h2 {
      text-align: center;
      margin-bottom: 25px;
      color: rgb(0, 150, 255);
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    input {
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.3s;
    }

    input:focus {
      border-color: rgb(0, 150, 255);
    }

    button {
      background: rgb(0, 150, 255);
      color: white;
      border: none;
      padding: 12px;
      font-size: 1rem;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    button:hover {
      background: rgb(0, 120, 220);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Responsive */
    @media (max-width: 600px) {
      .form-container {
        margin: 40px 15px;
        padding: 25px 15px;
      }
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="main-nav">
    <ul class="nav-left">
      <li><a href="index.html">Home</a></li>
      <li><a href="signup.html">Signup</a></li>
      <li><a href="login.html">Login</a></li>
    </ul>
  </nav>

  <!-- Signup Form -->
  <div class="form-container">
    <h2>Create Your Account</h2>
    <form id="signupForm" autocomplete="off">
      <input type="text" name="fullname" placeholder="Full Name" required />
      <input type="text" name="address" placeholder="Address" required />
      <input type="date" name="dob" required />
      <input type="text" name="username" placeholder="Username" required />
      <input type="email" name="email" placeholder="Email" required />
      <input type="password" name="password" placeholder="Password" required minlength="6" />
      <button type="submit">Sign Up</button>
    </form>
  </div>

  <script>
    // ✅ Render backend URL
    const BACKEND_URL = "https://my-backanduffufr7t.onrender.com";

    document.getElementById("signupForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const form = e.target;
      const formData = {
        fullname: form.fullname.value.trim(),
        address: form.address.value.trim(),
        dob: form.dob.value,
        username: form.username.value.trim(),
        email: form.email.value.trim(),
        password: form.password.value,
      };

      try {
        // ✅ Match with backend route: /signup
        const response = await fetch(`${BACKEND_URL}/signup`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(formData),
        });

        const text = await response.text();
        let result;

        try {
          result = JSON.parse(text);
        } catch {
          result = { message: text };
        }

        if (response.ok) {
          alert(result.message || "✅ Signup successful!");
          form.reset();
          window.location.href = "login.html";
        } else {
          alert(result.error || result.message || "❌ Signup failed. Please try again.");
        }
      } catch (err) {
        console.error("Error connecting to backend:", err);
        alert("⚠️ Could not connect to server. Please try again later.");
      }
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Directions Bot</title>
<style>
  body {
    margin: 0;
    padding: 0;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    color: #fff;
  }
  .ai-container {
    background: rgba(30, 30, 50, 0.95);
    padding: 30px 20px;
    border-radius: 20px;
    width: 90%;
    max-width: 500px;
    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  .ai-container h1 {
    text-align: center;
    color: #00ffff;
    margin: 0 0 10px 0;
    font-size: 1.8rem;
    text-shadow: 0 0 5px #00ffff;
  }
  .question-section {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .question-section label {
    font-weight: bold;
    color: #00ffff;
    text-shadow: 0 0 2px #00ffff;
  }
  .question-section input {
    padding: 12px;
    border-radius: 12px;
    border: none;
    outline: none;
    font-size: 1rem;
    background: #1e1e2f;
    color: #fff;
    box-shadow: inset 0 2px 5px rgba(0, 255, 255, 0.2);
    transition: 0.3s;
  }
  .question-section input:focus {
    box-shadow: 0 0 10px #00ffff;
  }
  .question-section button {
    padding: 12px;
    border-radius: 12px;
    border: none;
    background: #00ffff;
    color: #000;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
    text-transform: uppercase;
    font-size: 1rem;
  }
  .question-section button:hover {
    background: #00bcbc;
    box-shadow: 0 0 15px #00ffff;
  }
  .footer-note {
    text-align: center;
    font-size: 0.85rem;
    color: #aaa;
  }
  #answer {
    margin-top: 15px;
    background: #1e1e2f;
    padding: 12px;
    border-radius: 12px;
    max-height: 300px;
    overflow-y: auto;
    white-space: pre-line;
  }
</style>
</head>
<body>
<div class="ai-container">
  <h1>AI Directions Bot</h1>
  <div class="question-section">
    <label for="question">Ask for directions:</label>
    <input type="text" id="question" placeholder="e.g., from  Rajban meerut to Hanuman Chowk meerut" />
    <button id="sendBtn">Get Directions</button>
  </div>
  <div id="answer"></div>
  <p class="footer-note">Your AI assistant is ready!</p>
</div>

<script>
const sendBtn = document.getElementById('sendBtn');
const questionInput = document.getElementById('question');
const answerDiv = document.getElementById('answer');

async function getDirections() {
  const query = questionInput.value.trim();
  if (!query) return;

  answerDiv.innerHTML = 'Fetching directions...';

  try {
    const res = await fetch(`/api/directions?q=${encodeURIComponent(query)}`);
    const data = await res.json();

    if (data.error) {
      answerDiv.innerHTML = `Error: ${data.error}`;
      return;
    }

    if (data.steps && data.steps.length > 0) {
      // Show steps even if instruction is empty
      answerDiv.innerHTML = `<b>From:</b> ${data.origin}<br><b>To:</b> ${data.destination}<br><br>` +
        data.steps.map((s, i) => {
          const instr = s.instruction || 'Continue';
          return `${i + 1}. ${instr} (${s.distance}, ${s.duration})`;
        }).join('<br>');
    } else {
      answerDiv.innerHTML = 'No directions found for this route.';
    }

    answerDiv.scrollTop = 0;
    questionInput.value = '';
  } catch (err) {
    console.error(err);
    answerDiv.innerHTML = 'Error fetching directions. Try again later.';
  }
}

sendBtn.addEventListener('click', getDirections);
questionInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') getDirections();
});
</script>

</body>
</html>
